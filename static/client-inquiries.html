<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My inquiries · ShotCraft</title><style>body{margin:0;background:#f7f2ec;color:#211d21;font:15px/1.5 system-ui}.wrap{max-width:900px;margin:auto;padding:38px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.brand{font:700 23px Georgia,serif}.eyebrow{color:#c65c3d;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font:500 48px Georgia;margin:8px 0}.muted{color:#776f73}.card{background:#fffdfa;border:1px solid #e4dcd4;border-radius:18px;padding:22px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px}.status{border-radius:99px;padding:6px 10px;background:#eee9e4;font-size:11px;font-weight:800;height:max-content}.ready{background:#dcefdc;color:#24632b}.needs{background:#fff0d4;color:#815b15}a{color:#211d21;font-weight:700;text-decoration:none}button{border:0;border-radius:20px;background:#211d21;color:#fff;padding:9px 14px;font-weight:700;cursor:pointer}@media(max-width:600px){h1{font-size:38px}.row{display:block}.status{display:inline-block;margin-top:10px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">ShotCraft</div><a href="/client">New inquiry →</a></header><div class="eyebrow">Client workspace</div><h1>My inquiries</h1><p class="muted">Every idea, question, and update in one place.</p><div id="list">Loading your inquiries…</div></main><script>(function(){try{const u=JSON.parse(sessionStorage.getItem('shotcraftUser')||'null');if(!u||u.user_type!=='client')location.replace('/auth')}catch(e){location.replace('/auth')}})();async function load(){const list=document.getElementById('list'),u=JSON.parse(sessionStorage.getItem('shotcraftUser')||'{}'),items=await fetch('/api/inquiries?client_email='+encodeURIComponent(u.email||'')).then(r=>r.json());if(!items.length){list.innerHTML='<div class="card">No inquiries yet. Start with a new shoot idea.</div>';return}list.innerHTML=items.map(x=>{const p=JSON.parse(x.payload),action=x.status==='NEEDS_INFORMATION'?`<a href="/client/follow-up?id=${x.id}">Answer questions →</a>`:x.status==='READY_FOR_REVIEW'?'<span class="muted">With your photographer for review</span>':'<span class="muted">ShotCraft is reviewing the details</span>';return `<article class="card"><div class="row"><div><b>${p.client_name}</b><div class="muted">${p.shoot_date||'Flexible date'} · ${p.message.slice(0,150)}${p.message.length>150?'…':''}</div></div><span class="status ${x.status==='READY_FOR_REVIEW'?'ready':x.status==='NEEDS_INFORMATION'?'needs':''}">${x.status.replaceAll('_',' ')}</span></div><div style="margin-top:15px">${action}</div></article>`}).join('')}load();setInterval(load,10000)</script></body></html>
