<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production pack · ShotCraft</title><style>body{margin:0;background:#f7f2ec;color:#211d21;font:15px/1.5 system-ui}main{max-width:1050px;margin:auto;padding:42px 24px}.eyebrow{color:#c65c3d;font-weight:800;letter-spacing:.15em;font-size:11px;text-transform:uppercase}h1{font:52px Georgia;margin:10px 0 30px}.hero,.card{background:#fff;border:1px solid #e4dcd4;border-radius:20px;padding:25px;margin-top:18px}.hero{background:#211d21;color:#fff}.hero p{color:#d9d1cc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card h2{font:28px Georgia;margin:7px 0 15px}ul{padding-left:20px;color:#625a57}li{margin:8px 0}.weather-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{background:#f7f2ec;border-radius:12px;padding:13px}.metric small{display:block;color:#897f7b}.metric b{font-size:22px;display:block;margin-top:3px}.call{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.call small{color:#897f7b;display:block}.call b{display:block;margin-top:4px}@media(max-width:750px){.grid{grid-template-columns:1fr}.call{grid-template-columns:1fr 1fr}h1{font-size:40px}}</style></head><body><script>(function(){try{const u=JSON.parse(sessionStorage.getItem("shotcraftUser")||"null");if(!u||u.user_type!=="photographer")location.replace("/auth")}catch(e){location.replace("/auth")}})();</script><main><div class="eyebrow">ShotCraft · Production pack</div><h1 id="title">Building your shoot plan…</h1><div id="app"></div></main><script>const id=new URLSearchParams(location.search).get('id')||'1';const list=(title,items)=>`<section class="card"><div class="eyebrow">${title}</div><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;async function load(){const inquiry=await fetch('/api/inquiries/'+id).then(r=>r.json());if(inquiry.error){app.innerHTML='<div class="card">'+inquiry.error+'</div>';return}const p=JSON.parse(inquiry.payload);const pack=await fetch('/api/production-packs/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inquiry:p,client_answers:{}})}).then(r=>r.json());title.textContent=pack.title;app.innerHTML=`<section class="hero"><div class="eyebrow" style="color:#d9896d">Call sheet</div><div class="call">${Object.entries(pack.call_sheet).map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div></section><div class="grid">${list('Location plan',pack.location_plan)}${list('Shot list',pack.shot_list)}${list('Lighting plan',pack.lighting_plan)}${list('Wardrobe checklist',pack.wardrobe_checklist)}</div><div class="grid"><section class="card"><div class="eyebrow">Weather snapshot</div><div class="weather-metrics">${(()=>{const m=pack.weather_note.match(/high ([\d.]+)°C, rain probability ([\d.]+)%, wind up to ([\d.]+) km\/h/);return m?`<div class=\"metric\"><small>High</small><b>${m[1]}°C</b></div><div class=\"metric\"><small>Rain chance</small><b>${m[2]}%</b></div><div class=\"metric\"><small>Max wind</small><b>${m[3]} km/h</b></div>`:`<div class=\"metric\"><small>Planning note</small><b>Check forecast</b></div>`})()}</div><p><b>Recommendation:</b> ${pack.weather_note.includes('rain probability 0%')?'Good conditions for an outdoor shoot. Recheck the forecast 3 hours before call time.':'Review the rain risk and confirm the indoor backup before call time.'}</p></section><section class="card"><div class="eyebrow">Backup plan</div><p>${pack.backup_plan}</p></section></div>`}load();</script></body></html>
