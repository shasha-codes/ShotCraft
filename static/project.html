<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project · ShotCraft</title><style>body{margin:0;background:#f4efe8;color:#211e22;font:15px system-ui}main{max-width:1100px;margin:auto;padding:42px 25px}.eyebrow{color:#b85f45;font-weight:800;letter-spacing:.14em;font-size:11px;text-transform:uppercase}h1{font:52px Georgia;margin:10px 0}.muted{color:#847b78}.pill{background:#dcefdc;color:#24632b;border-radius:99px;padding:8px 13px;font-weight:750;font-size:12px}.top,.row{display:flex;justify-content:space-between;gap:20px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:30px}.card{background:#fff;border:1px solid #e2d9d0;border-radius:20px;padding:25px}.hero{height:300px;border-radius:14px;background:linear-gradient(135deg,#bc8c70,#2e3330 55%,#d4c2ac);display:flex;align-items:end;padding:18px;color:#fff;font:28px Georgia}.hero{position:relative;overflow:hidden}.collage{display:grid;grid-template-columns:1fr;grid-template-rows:1fr;width:100%;height:100%;gap:5px;filter:saturate(.85)}.collage-tile{position:relative;overflow:hidden}.collage-tile:first-child{grid-row:span 1}.collage-tile img{width:100%;height:100%;object-fit:contain;object-position:center;background:#d8c9bb;transition:transform .45s ease;display:block}.collage-tile:hover img{transform:scale(1.06)}.collage-tile:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#211e22b8);pointer-events:none}.collage-label{position:absolute;bottom:10px;left:10px;right:6px;color:#fff;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;z-index:1}.hero-label{position:absolute;top:16px;left:16px;bottom:auto;font:24px Georgia;color:#fff;text-shadow:0 2px 12px #000}.brief-block{border-top:1px solid #eee5dc;padding:13px 0;line-height:1.45}.brief-block p{margin:6px 0;color:#5f5754}.follow{background:#fbf8f4;border-radius:10px;padding:13px}.quote{font:25px Georgia;line-height:1.3}.meta{display:flex;gap:25px;color:#847b78}.meta b{display:block;color:#211e22;font-size:18px;margin-top:4px}.step{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid #e2d9d0}.dot{width:26px;height:26px;border-radius:50%;background:#dcefdc;color:#24632b;text-align:center;line-height:26px;font-weight:800}.next{background:#211e22;color:#fff;border-radius:16px;padding:18px;margin-top:18px}.next button{border:0;border-radius:22px;padding:12px 17px;margin-top:10px;font-weight:750}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:40px}}
</style></head><body><script>(function(){try{const u=JSON.parse(sessionStorage.getItem("shotcraftUser")||"null");if(!u||u.user_type!=="photographer")location.replace("/auth")}catch(e){location.replace("/auth")}})();</script><main><div id="app">Loading project…</div></main><script>const id=new URLSearchParams(location.search).get('id')||'1';async function load(){const r=await fetch('/api/inquiries/'+id),d=await r.json();if(d.error){app.textContent=d.error;return}const p=JSON.parse(d.payload),a=JSON.parse(d.analysis||'{}'),ready=d.status==='READY_FOR_REVIEW',hasMoodboard=!!sessionStorage.getItem('shotcraftMoodboard');app.innerHTML=`<div class="top"><div><div class="eyebrow">Active project · Inquiry #${d.id}</div><h1>${p.client_name}</h1></div><span class="pill">${d.status.replaceAll('_',' ')}</span></div><div class="grid"><section class="card"><div class="hero" id="hero"><div class="hero-label">${p.shoot_type||'Portrait'} · ${p.shoot_date||'Date flexible'}</div></div><div class="brief-block"><div class="eyebrow">Client inquiry</div><p>${p.message.split("\n\nClient follow-up answers:")[0]}</p></div><div class="brief-block follow"><div class="eyebrow">Client follow-up answers</div><p>${p.message.includes("Client follow-up answers:")?p.message.split("Client follow-up answers:")[1]:"No follow-up answers recorded."}</p></div><p class="quote">${a.summary||'Agent summary is being prepared.'}</p><div class="meta"><div>Budget<b>$${p.budget||'—'}</b></div><div>Date<b>${p.shoot_date||'Flexible'}</b></div><div>Contact<b>${p.client_email}</b></div></div></section><aside class="card"><div class="eyebrow">Agent progress</div><div class="step"><span class="dot">✓</span><div><b>Inquiry received</b><div class="muted">Details captured</div></div></div><div class="step"><span class="dot">✓</span><div><b>Information gathered</b><div class="muted">${ready?'All required questions resolved':'Follow-up pending'}</div></div></div><div class="step"><span class="dot" style="background:${ready?'#dcefdc':'#eee'}">${ready?'✓':'○'}</span><div><b>Ready for review</b><div class="muted">${ready?'Creative direction can begin':'Waiting for client details'}</div></div></div><div class="next"><b>Your next move</b><div style="margin-top:5px;color:#d9d1cc">${hasMoodboard?'Moodboard approved. Build the shoot plan next.':ready?'Review the inquiry and create a brief.':'Wait for the client to answer follow-up questions.'}</div>${hasMoodboard?'<button onclick="location.href=\'/photographer/project/production?id='+d.id+'\'">Generate production pack →</button>':ready?'<button onclick="location.href=\'/photographer/project/brief?id='+d.id+'\'">Review creative brief →</button>':''}</div></aside></div>`}load();</script></body></html>
</html><style>.pill{display:inline-block;white-space:nowrap;align-self:flex-start}</style>
</html><script>setInterval(()=>{const raw=sessionStorage.getItem('shotcraftMoodboard');if(raw){try{const d=JSON.parse(raw),hero=document.getElementById('hero');if(hero&&!hero.dataset.collage){hero.dataset.collage='1';hero.innerHTML='<div class="collage">'+d.generated.tiles.slice(0,1).map(t=>'<div class=\"collage-tile\"><img src=\"'+t.image_url+'\"></div>').join('')+'</div><div class="hero-label">Portrait · Editorial direction</div>';}}catch(e){}}if(!raw||document.getElementById('moodboardPreview'))return;try{const d=JSON.parse(raw);const section=document.createElement('section');section.id='moodboardPreview';section.className='card';section.style.marginTop='18px';section.innerHTML='<div class="eyebrow">Approved moodboard</div><h2 style="font:32px Georgia">'+d.moodboard.title+'</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">'+d.generated.tiles.map(t=>'<figure style="margin:0"><img src="'+t.image_url+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px"><figcaption class="muted" style="padding-top:7px">'+t.title+'</figcaption></figure>').join('')+'</div><div class="next" style="margin-top:20px"><b>Next: production pack</b><div style="margin-top:5px;color:#d9d1cc">Turn this direction into a shoot-ready plan.</div><button>Generate production pack →</button></div>';document.querySelector('main').appendChild(section)}catch(e){}} ,500)</script>
