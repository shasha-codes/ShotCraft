<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative brief · ShotCraft</title><style>body{margin:0;background:#f4efe8;color:#211e22;font:15px system-ui}main{max-width:900px;margin:45px auto;padding:0 24px}.eyebrow{color:#b85f45;font-weight:800;letter-spacing:.14em;font-size:11px;text-transform:uppercase}h1{font:52px Georgia;margin:10px 0}.card{background:#fff;border:1px solid #e2d9d0;border-radius:18px;padding:25px;margin-top:24px}.field{padding:15px 0;border-bottom:1px solid #eee5dc;line-height:1.5}.field b{display:block;margin-bottom:5px}.muted{color:#847b78}button{background:#211e22;color:#fff;border:0;border-radius:22px;padding:13px 19px;font-weight:750;margin-top:20px}</style></head><body><script>(function(){try{const u=JSON.parse(sessionStorage.getItem("shotcraftUser")||"null");if(!u||u.user_type!=="photographer")location.replace("/auth")}catch(e){location.replace("/auth")}})();</script><main id="app"><p>Loading brief…</p></main><script>const id=new URLSearchParams(location.search).get('id')||'1';async function load(){const inquiryRes=await fetch('/api/inquiries/'+id),record=await inquiryRes.json();if(record.error){app.innerHTML='<p>'+record.error+'</p>';return}const payload=JSON.parse(record.payload);const briefRes=await fetch('/api/inquiries/brief',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inquiry:payload,client_answers:{}})});if(!briefRes.ok){app.innerHTML='<p>Could not create brief.</p>';return}const brief=await briefRes.json();app.innerHTML=`<div class="eyebrow">Creative brief · ${payload.client_name}</div><h1>${brief.concept_name}</h1><p class="muted">Review this AI-generated direction before rendering visual references.</p><section class="card"><div class="field"><b>Creative summary</b>${brief.creative_summary}</div><div class="field"><b>Location</b>${brief.location_direction}</div><div class="field"><b>Lighting</b>${brief.lighting_direction}</div><div class="field"><b>Posing</b>${brief.posing_direction}</div><div class="field"><b>Wardrobe</b>${brief.wardrobe_direction}</div><div class="field"><b>Deliverables</b>${brief.deliverables.join(', ')}</div><div class="field"><b>Budget notes</b>${brief.budget_notes}</div><button onclick="sessionStorage.setItem('shotcraftBrief',JSON.stringify(${JSON.stringify(brief)}));location.href='/photographer/project?id=${id}'">Approve brief and continue →</button></section>`}load();</script></body></html>
</html><script>document.addEventListener('click',async event=>{if(event.target.tagName==='BUTTON'){event.preventDefault();event.stopImmediatePropagation();event.target.disabled=true;event.target.textContent='Rendering moodboard…';const id=new URLSearchParams(location.search).get('id')||'1';const q=await fetch('/api/inquiries/'+id),rec=await q.json(),p=JSON.parse(rec.payload),br=await fetch('/api/inquiries/brief',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inquiry:p,client_answers:{}})}),brief=await br.json(),mr=await fetch('/api/moodboards/create-and-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brief})}),result=await mr.json();sessionStorage.setItem('shotcraftMoodboard',JSON.stringify(result));location.href='/photographer/project?id='+id}},true)</script>
