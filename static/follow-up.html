<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Follow-up · ShotCraft</title><style>body{font:16px/1.5 Inter,system-ui,sans-serif;max-width:720px;margin:0 auto;padding:40px 20px;background:#f7f2ec;color:#211d21}main{background:#fffdfa;padding:34px;border:1px solid #e6dcd2;border-radius:22px;box-shadow:0 18px 50px #3c28190f}p.eyebrow{color:#c65c3d;font-size:11px;font-weight:800;letter-spacing:.16em}h1{font:500 42px/1.05 Georgia,serif;margin:10px 0 16px}#summary,#questions{color:#776f73}textarea{width:100%;min-height:180px;padding:14px;border:1px solid #e6dcd2;border-radius:11px;font:inherit;box-sizing:border-box;resize:vertical}button{margin-top:16px;background:#211d21;color:#fff;border:0;border-radius:22px;padding:13px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#status{color:#776f73}</style></head><body><script>(function(){try{const u=JSON.parse(sessionStorage.getItem("shotcraftUser")||"null");if(!u||u.user_type!=="client")location.replace("/auth")}catch(e){location.replace("/auth")}})();</script><main><p class="eyebrow">SHOTCRAFT · ONE LAST THING</p><h1>A few details for your shoot</h1><p id="summary">Loading your inquiry…</p><div id="questions"></div><textarea id="answers" placeholder="Type your answers here…"></textarea><button id="send" type="button">Send answers →</button><p id="status" role="status" aria-live="polite"></p></main><script>
const id=new URLSearchParams(location.search).get('id')||'1',summaryEl=document.getElementById('summary'),questionsEl=document.getElementById('questions'),answersEl=document.getElementById('answers'),sendBtn=document.getElementById('send'),statusEl=document.getElementById('status');
async function load(){try{const r=await fetch('/api/inquiries/'+id);const data=await r.json();if(data.error){summaryEl.textContent=data.error;sendBtn.disabled=true;return}const analysis=JSON.parse(data.analysis||'{}');summaryEl.textContent=analysis.summary||'Please add a few details so we can plan your shoot.';questionsEl.innerHTML=(analysis.questions||[]).length?'<h3>ShotCraft needs to know:</h3><ol>'+analysis.questions.map(q=>'<li>'+q+'</li>').join('')+'</ol>':'<p>No further details are required.</p>'}catch(e){summaryEl.textContent='We could not load this inquiry. Please refresh and try again.'}}
async function submit(){sendBtn.disabled=true;statusEl.textContent='Sending your answers…';try{const r=await fetch('/api/inquiries/'+id+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:answersEl.value})});if(!r.ok)throw Error();location.href='/client/confirmation?id='+id}catch(e){statusEl.textContent='Could not send answers. Please try again.';sendBtn.disabled=false}}
load();sendBtn.onclick=submit;
</script></body></html>
